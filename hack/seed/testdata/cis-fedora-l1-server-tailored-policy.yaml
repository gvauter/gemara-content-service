title: Linux VM Compliance Policy - CIS Fedora Server L1 (Tailored)
metadata:
  id: linux-vm-compliance-policy-tailored
  type: Policy
  gemara-version: "0.1.0"
  version: "1.0.0"
  description: >-
    Tailored policy derived from the base CIS Fedora Server L1 policy. This
    variant excludes file integrity monitoring (AIDE) and network stack
    hardening checks. File integrity is excluded because the target VMs are
    rebuilt from trusted images on every deploy and never persist long enough
    to benefit from AIDE baselines. Network hardening is excluded because the
    VMs operate behind cloud-managed firewalls and network policies that
    enforce equivalent controls at the infrastructure layer.
  author:
    id: acme-platform-team
    name: ACME Platform Engineering
    type: Human
  mapping-references:
    - id: cis-fedora-server-l1-controls
      title: CIS Fedora Server L1 Controls Catalog
      version: "1.0.0"
      description: Gemara Layer 2 control catalog for CIS Fedora Server Level 1
    - id: cis-fedora-server-l1-policy
      title: CIS Fedora Server L1 Compliance Policy (Base)
      version: "1.0.0"
      description: Base policy this tailored policy is derived from
contacts:
  responsible:
    - name: ACME Platform Engineering Team
  accountable:
    - name: Chief Information Security Officer
scope:
  in:
    technologies:
      - Linux Virtual Machines
      - Fedora
      - Cloud Infrastructure
imports:
  catalogs:
    - reference-id: cis-fedora-server-l1-controls
adherence:
  evaluation-methods:
    - type: Automated
      description: OpenSCAP automated compliance evaluation
      executor:
        id: openscap
        name: OpenSCAP
        type: Software
  assessment-plans:
    # --- CIS-AUDIT (kept — audit logging required on all VMs) ---
    - id: package_audit_installed
      requirement-id: package_audit_installed
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: service_auditd_enabled
      requirement-id: service_auditd_enabled
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: grub2_audit_argument
      requirement-id: grub2_audit_argument
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: grub2_audit_backlog_limit_argument
      requirement-id: grub2_audit_backlog_limit_argument
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events
      requirement-id: audit_rules_login_events
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events_faillock
      requirement-id: audit_rules_login_events_faillock
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events_lastlog
      requirement-id: audit_rules_login_events_lastlog
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_session_events
      requirement-id: audit_rules_session_events
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    # --- CIS-SSH (kept — SSH hardening required on all VMs) ---
    - id: sshd_disable_root_login
      requirement-id: sshd_disable_root_login
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: sshd_set_idle_timeout
      requirement-id: sshd_set_idle_timeout
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: file_permissions_sshd_config
      requirement-id: file_permissions_sshd_config
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: file_owner_sshd_config
      requirement-id: file_owner_sshd_config
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: file_groupowner_sshd_config
      requirement-id: file_groupowner_sshd_config
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: configure_ssh_crypto_policy
      requirement-id: configure_ssh_crypto_policy
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    # --- CIS-CRYPTO (kept — crypto policy required on all VMs) ---
    - id: configure_crypto_policy
      requirement-id: configure_crypto_policy
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    # --- CIS-INTEGRITY — EXCLUDED ---
    # Rationale: VMs are rebuilt from trusted images on every deploy.
    # AIDE baselines provide no value when the filesystem is replaced each cycle.
    # Risk acceptance: ACME-RA-2026-003
    #
    # --- CIS-NETWORK — EXCLUDED ---
    # Rationale: VMs run behind cloud-managed VPC firewalls, security groups,
    # and network policies that enforce equivalent controls (no forwarding,
    # no redirects, SYN flood protection) at the infrastructure layer.
    # Risk acceptance: ACME-RA-2026-004
    #
    # --- CIS-AUTH (kept — authentication hardening required) ---
    - id: accounts_password_pam_minlen
      requirement-id: accounts_password_pam_minlen
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: accounts_password_pam_minclass
      requirement-id: accounts_password_pam_minclass
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: accounts_passwords_pam_faillock_deny
      requirement-id: accounts_passwords_pam_faillock_deny
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: accounts_passwords_pam_faillock_unlock_time
      requirement-id: accounts_passwords_pam_faillock_unlock_time
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: no_empty_passwords
      requirement-id: no_empty_passwords
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: accounts_no_uid_except_zero
      requirement-id: accounts_no_uid_except_zero
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
